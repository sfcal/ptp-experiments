---
# Role order matters for handlers: handlers fire in definition order, and
# roles register theirs in listing order. 'timecard' must precede the PTP
# roles so "Run timecard-sma" (SMA routing + kernel PPS enable) fires before
# ts2phc/ptp4l restart.
- name: Deploy PTP grandmaster
  hosts: ptp_server
  become: true

  pre_tasks:
    - name: Update apt cache.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 1800
      tags: [always]

  tasks:
    - name: Configure network.
      ansible.builtin.import_role:
        name: network
      tags: [network]

    - name: Configure GPS.
      ansible.builtin.import_role:
        name: gpsd
      tags: [gpsd]

    - name: Configure Timecard (udev rules + SMA routing).
      ansible.builtin.import_role:
        name: timecard
      tags: [timecard]

    - name: Configure chrony (NTP server, Timecard refclock).
      ansible.builtin.import_role:
        name: chrony
      tags: [chrony]

    - name: Install igc-ppsfix DKMS driver.
      ansible.builtin.import_tasks: tasks/igc-ppsfix.yml
      when: igc_ppsfix_enabled | default(false)
      tags: [dkms]

    - name: Install ptp-ocp-gnsspps DKMS driver.
      ansible.builtin.import_tasks: tasks/ptp-ocp-gnsspps.yml
      when: ptp_ocp_gnsspps_enabled | default(false)
      tags: [dkms]

    - name: Build linuxptp from source.
      ansible.builtin.import_role:
        name: linuxptp
      tags: [ptp]

    - name: Configure ptp4l.
      ansible.builtin.import_role:
        name: ptp4l
      tags: [ptp]

    - name: Configure the NIC-PHC discipline pipeline.
      ansible.builtin.import_role:
        name: gm_pipeline
      tags: [ptp, pipeline]

    - name: Deploy ptp metrics collector.
      ansible.builtin.import_role:
        name: ptp_metrics
      tags: [monitoring]

    - name: Deploy monitoring stack.
      ansible.builtin.import_role:
        name: monitoring_server
      tags: [monitoring]

- name: Deploy PTP clients
  hosts: ptp_clients
  become: true

  pre_tasks:
    - name: Update apt cache.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 1800
      tags: [always]

  tasks:
    - name: Configure network.
      ansible.builtin.import_role:
        name: network
      tags: [network]

    - name: Install igc-ppsfix DKMS driver (i226 clients).
      ansible.builtin.import_tasks: tasks/igc-ppsfix.yml
      when: igc_ppsfix_enabled | default(false)
      tags: [dkms]

    - name: Build linuxptp from source.
      ansible.builtin.import_role:
        name: linuxptp
      tags: [ptp]

    - name: Configure ptp4l.
      ansible.builtin.import_role:
        name: ptp4l
      tags: [ptp]

    - name: Configure chrony (system clock from NIC PHC).
      ansible.builtin.import_role:
        name: chrony
      tags: [chrony]

    - name: Deploy ptp metrics collector.
      ansible.builtin.import_role:
        name: ptp_metrics
      tags: [monitoring]

    - name: Deploy node exporter.
      ansible.builtin.import_role:
        name: monitoring_agent
      tags: [monitoring]
