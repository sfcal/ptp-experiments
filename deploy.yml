---
# Role order matters for handlers: handlers fire in definition order, and
# roles register theirs in listing order. 'timecard' must precede the PTP
# roles so "Run timecard-sma" (SMA routing + kernel PPS enable) fires before
# ts2phc/ptp4l restart.
- name: Deploy PTP grandmaster
  hosts: server
  become: true

  pre_tasks:
    - name: Update apt cache.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 1800
      tags: [always]

  tasks:
    - name: Configure Timecard (driver, SMA routing, GPS).
      ansible.builtin.import_role:
        name: timecard
      tags: [timecard]

    - name: Arm the TGPIO 1PPS generator on pin 123.
      ansible.builtin.import_role:
        name: tgpio_pps
      when: tgpio_pps_enabled | default(false)
      tags: [tgpio]

    - name: Build linuxptp and configure ptp4l/ts2phc.
      ansible.builtin.import_role:
        name: linuxptp
      tags: [ptp]

    - name: Configure chrony (NTP server, Timecard refclock).
      ansible.builtin.import_role:
        name: chrony
      tags: [chrony]

    # - name: Install igc-ppsfix DKMS driver (TimeNIC I226 PPS fixes, see igc-ppsfix/).
    #   ansible.builtin.import_role:
    #     name: dkms_module
    #   when: igc_ppsfix_enabled | default(false)
    #   tags: [dkms]
    #   vars:
    #     dkms_name: igc
    #     dkms_display: igc-ppsfix
    #     dkms_version: "{{ igc_ppsfix_version }}"
    #     dkms_src: "{{ playbook_dir }}/igc-ppsfix/dkms/"
    #     dkms_deploy_path: "{{ igc_ppsfix_deploy_path }}"
    #     dkms_reboot_pkg: igc-ppsfix-dkms
    #     dkms_modinfo_asserts: ['/updates/', 'edge_check_delay_us', 'edge_check_invert']
    #     dkms_auto_reboot: "{{ igc_ppsfix_auto_reboot | default(false) }}"

- name: Deploy PTP clients
  hosts: clients
  become: true

  pre_tasks:
    - name: Update apt cache.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 1800
      tags: [always]

    # ts2phc_enabled defaults to false, so clients get only ptp4l.
    - name: Build linuxptp and configure ptp4l.
      ansible.builtin.import_role:
        name: linuxptp
      tags: [ptp]

