---
# Install the ptp-ocp-gnsspps DKMS driver (raw GNSS PPS on the kernel PPS
# device, see ptp-ocp-gnsspps/). The module is only installed on disk -- it is
# loaded at the next reboot. Never reload ptp_ocp live here: chrony, ts2phc
# and gpsd hold the Time Card open, and the conservative igc-ppsfix reboot
# convention keeps deploys predictable.

- name: Install DKMS build prerequisites.
  ansible.builtin.apt:
    name:
      - dkms
      - "linux-headers-{{ ansible_kernel }}"
    state: present

- name: Copy ptp-ocp-gnsspps DKMS source tree.
  ansible.builtin.copy:
    src: ptp-ocp-gnsspps/dkms/
    dest: "{{ ptp_ocp_gnsspps_deploy_path }}/"
    owner: root
    group: root
    mode: preserve
  register: ptp_ocp_gnsspps_src

- name: Enable gnss_pps on module load.
  ansible.builtin.copy:
    dest: /etc/modprobe.d/ptp_ocp-gnsspps.conf
    content: |
      # Managed by Ansible (tasks/ptp-ocp-gnsspps.yml). Feed the Time Card's
      # kernel PPS device from the raw GNSS 1PPS timestamper (ts0).
      options ptp_ocp gnss_pps=1
    owner: root
    group: root
    mode: "0644"

- name: Check current DKMS state for ptp_ocp.
  ansible.builtin.command:
    cmd: dkms status ptp_ocp/{{ ptp_ocp_gnsspps_version }}
  register: ptp_ocp_gnsspps_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Remove stale DKMS module after source change.
  ansible.builtin.command:
    cmd: dkms remove ptp_ocp/{{ ptp_ocp_gnsspps_version }} --all
  when:
    - ptp_ocp_gnsspps_src.changed
    - ptp_ocp_gnsspps_version in ptp_ocp_gnsspps_status.stdout | default('')

- name: Register ptp-ocp-gnsspps with DKMS.
  ansible.builtin.command:
    cmd: dkms add {{ ptp_ocp_gnsspps_deploy_path }}
    creates: /var/lib/dkms/ptp_ocp/{{ ptp_ocp_gnsspps_version }}/source

# dkms install builds first if needed, so no separate build step.
- name: Build and install ptp-ocp-gnsspps for the running kernel.
  ansible.builtin.command:
    cmd: dkms install --force ptp_ocp/{{ ptp_ocp_gnsspps_version }} -k {{ ansible_kernel }}
  register: ptp_ocp_gnsspps_install
  when: >-
    ptp_ocp_gnsspps_src.changed
    or 'installed' not in ptp_ocp_gnsspps_status.stdout | default('')

- name: Refresh module dependencies.
  ansible.builtin.command:
    cmd: depmod -a
  when: ptp_ocp_gnsspps_install.changed

- name: Rebuild initramfs so the DKMS ptp_ocp is used from early boot.
  ansible.builtin.command:
    cmd: update-initramfs -u -k {{ ansible_kernel }}
  when: ptp_ocp_gnsspps_install.changed

- name: Inspect on-disk ptp_ocp module.
  ansible.builtin.command:
    cmd: modinfo ptp_ocp
  register: ptp_ocp_gnsspps_modinfo
  changed_when: false
  check_mode: false

- name: Assert the DKMS ptp_ocp is the module depmod will load.
  ansible.builtin.assert:
    that:
      - "'/updates/' in ptp_ocp_gnsspps_modinfo.stdout"
      - "'gnss_pps' in ptp_ocp_gnsspps_modinfo.stdout"
    fail_msg: "modinfo ptp_ocp does not show the DKMS gnsspps module; check dkms status."
  when: not ansible_check_mode

- name: Read srcversion of the on-disk ptp_ocp module.
  ansible.builtin.command:
    cmd: modinfo -F srcversion ptp_ocp
  register: ptp_ocp_gnsspps_disk_srcver
  changed_when: false
  check_mode: false

- name: Read srcversion of the loaded ptp_ocp module.
  ansible.builtin.slurp:
    src: /sys/module/ptp_ocp/srcversion
  register: ptp_ocp_gnsspps_live_srcver
  failed_when: false

- name: Determine whether a reboot is needed to load ptp-ocp-gnsspps.
  ansible.builtin.set_fact:
    ptp_ocp_gnsspps_reboot_required: >-
      {{ ptp_ocp_gnsspps_live_srcver.content is defined and
         (ptp_ocp_gnsspps_live_srcver.content | b64decode | trim)
         != (ptp_ocp_gnsspps_disk_srcver.stdout | trim) }}

# /run is tmpfs, so both flags self-clear on reboot.
- name: Flag reboot required (Ubuntu convention).
  ansible.builtin.lineinfile:
    path: /run/reboot-required.pkgs
    line: ptp-ocp-gnsspps-dkms
    create: true
    mode: "0644"
  when: ptp_ocp_gnsspps_reboot_required

- name: Ensure /run/reboot-required exists.
  ansible.builtin.copy:
    dest: /run/reboot-required
    content: "*** System restart required ***\n"
    mode: "0644"
  when: ptp_ocp_gnsspps_reboot_required

- name: Warn that the running ptp_ocp is not the gnsspps build.
  ansible.builtin.debug:
    msg: >-
      ptp-ocp-gnsspps is installed on disk but the RUNNING ptp_ocp module is
      still the stock driver, so /dev/pps-timecard carries the disciplined
      FPGA PPS until reboot. Reboot this host to load it (chrony, ts2phc and
      gpsd hold the Time Card open, so a live reload needs them stopped). Set
      ptp_ocp_gnsspps_auto_reboot=true to let Ansible reboot instead.
  when: ptp_ocp_gnsspps_reboot_required

- name: Reboot to load ptp-ocp-gnsspps (opt-in).
  ansible.builtin.reboot:
    reboot_timeout: 600
  when:
    - ptp_ocp_gnsspps_reboot_required
    - ptp_ocp_gnsspps_auto_reboot | default(false)
