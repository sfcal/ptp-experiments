---
# Install the igc-ppsfix DKMS driver (TimeNIC I226 PPS fixes, see igc-ppsfix/).
# The module is only installed on disk -- it is loaded at the next reboot.
# Never reload igc live here: enp1s0 is the igc NIC carrying this SSH session.

- name: Install DKMS build prerequisites.
  ansible.builtin.apt:
    name:
      - dkms
      - "linux-headers-{{ ansible_kernel }}"
    state: present

- name: Copy igc-ppsfix DKMS source tree.
  ansible.builtin.copy:
    src: igc-ppsfix/dkms/
    dest: "{{ igc_ppsfix_deploy_path }}/"
    owner: root
    group: root
    mode: preserve
  register: igc_ppsfix_src

- name: Check current DKMS state for igc.
  ansible.builtin.command:
    cmd: dkms status igc/{{ igc_ppsfix_version }}
  register: igc_ppsfix_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Remove stale DKMS module after source change.
  ansible.builtin.command:
    cmd: dkms remove igc/{{ igc_ppsfix_version }} --all
  when:
    - igc_ppsfix_src.changed
    - igc_ppsfix_version in igc_ppsfix_status.stdout | default('')

- name: Register igc-ppsfix with DKMS.
  ansible.builtin.command:
    cmd: dkms add {{ igc_ppsfix_deploy_path }}
    creates: /var/lib/dkms/igc/{{ igc_ppsfix_version }}/source

# dkms install builds first if needed, so no separate build step.
- name: Build and install igc-ppsfix for the running kernel.
  ansible.builtin.command:
    cmd: dkms install --force igc/{{ igc_ppsfix_version }} -k {{ ansible_kernel }}
  register: igc_ppsfix_install
  when: >-
    igc_ppsfix_src.changed
    or 'installed' not in igc_ppsfix_status.stdout | default('')

- name: Refresh module dependencies.
  ansible.builtin.command:
    cmd: depmod -a
  when: igc_ppsfix_install.changed

- name: Rebuild initramfs so the DKMS igc is used from early boot.
  ansible.builtin.command:
    cmd: update-initramfs -u -k {{ ansible_kernel }}
  when: igc_ppsfix_install.changed

- name: Inspect on-disk igc module.
  ansible.builtin.command:
    cmd: modinfo igc
  register: igc_ppsfix_modinfo
  changed_when: false
  check_mode: false

- name: Assert the DKMS igc is the module depmod will load.
  ansible.builtin.assert:
    that:
      - "'/updates/' in igc_ppsfix_modinfo.stdout"
      - "'edge_check_delay_us' in igc_ppsfix_modinfo.stdout"
      - "'edge_check_invert' in igc_ppsfix_modinfo.stdout"
    fail_msg: "modinfo igc does not show the DKMS ppsfix module; check dkms status."
  when: not ansible_check_mode

- name: Read srcversion of the on-disk igc module.
  ansible.builtin.command:
    cmd: modinfo -F srcversion igc
  register: igc_ppsfix_disk_srcver
  changed_when: false
  check_mode: false

- name: Read srcversion of the loaded igc module.
  ansible.builtin.slurp:
    src: /sys/module/igc/srcversion
  register: igc_ppsfix_live_srcver
  failed_when: false

- name: Determine whether a reboot is needed to load igc-ppsfix.
  ansible.builtin.set_fact:
    igc_ppsfix_reboot_required: >-
      {{ igc_ppsfix_live_srcver.content is defined and
         (igc_ppsfix_live_srcver.content | b64decode | trim)
         != (igc_ppsfix_disk_srcver.stdout | trim) }}

# /run is tmpfs, so both flags self-clear on reboot.
- name: Flag reboot required (Ubuntu convention).
  ansible.builtin.lineinfile:
    path: /run/reboot-required.pkgs
    line: igc-ppsfix-dkms
    create: true
    mode: "0644"
  when: igc_ppsfix_reboot_required

- name: Ensure /run/reboot-required exists.
  ansible.builtin.copy:
    dest: /run/reboot-required
    content: "*** System restart required ***\n"
    mode: "0644"
  when: igc_ppsfix_reboot_required

- name: Warn that the running igc is not the ppsfix build.
  ansible.builtin.debug:
    msg: >-
      igc-ppsfix is installed on disk but the RUNNING igc module is still the
      stock driver. Reboot the grandmaster to load it (do NOT reload the module
      live: enp1s0 is the igc NIC carrying this SSH session). Set
      igc_ppsfix_auto_reboot=true to let Ansible reboot instead.
  when: igc_ppsfix_reboot_required

- name: Reboot to load igc-ppsfix (opt-in).
  ansible.builtin.reboot:
    reboot_timeout: 600
  when:
    - igc_ppsfix_reboot_required
    - igc_ppsfix_auto_reboot | default(false)
