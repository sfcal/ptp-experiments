---
# Metrics only: node_exporter + ptp-metrics textfile collector.
# Grafana/Prometheus/Docker stay on the grandmaster, which scrapes us.
- name: Install node exporter.
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
  when: monitoring_enabled

- name: Ensure node exporter is running.
  ansible.builtin.service:
    name: prometheus-node-exporter
    state: started
    enabled: true
  when: monitoring_enabled

- name: Deploy ptp4l metrics collector script.
  ansible.builtin.template:
    src: templates/monitoring/ptp-metrics.sh.j2
    dest: /usr/local/bin/ptp-metrics.sh
    mode: 0755
  when: monitoring_enabled

- name: Deploy ptp4l metrics systemd units.
  ansible.builtin.template:
    src: "templates/monitoring/{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: 0644
  loop:
    - ptp-metrics.service
    - ptp-metrics.timer
  when: monitoring_enabled

- name: Ensure ptp4l metrics timer is running.
  ansible.builtin.systemd_service:
    name: ptp-metrics.timer
    state: started
    enabled: true
    daemon_reload: true
  when: monitoring_enabled
