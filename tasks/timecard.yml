---
# Timecard SMA input/output routing via the ptp_ocp sysfs interface.
# Sysfs writes do not survive a reboot, so a oneshot systemd unit reapplies
# the configured mapping at boot; the handler applies it at deploy time.

- name: Deploy Timecard SMA routing script.
  ansible.builtin.template:
    src: templates/timecard/timecard-sma.sh.j2
    dest: /usr/local/bin/timecard-sma.sh
    owner: root
    group: root
    mode: "0755"
  notify: Run timecard-sma

- name: Deploy Timecard SMA systemd unit.
  ansible.builtin.template:
    src: templates/timecard/timecard-sma.service.j2
    dest: /etc/systemd/system/timecard-sma.service
    owner: root
    group: root
    mode: "0644"
  notify: Run timecard-sma

# Enable only: first-time activation and config changes both go through the
# handler, whose 'restarted' state re-runs the RemainAfterExit oneshot.
- name: Ensure timecard-sma runs at boot.
  ansible.builtin.systemd_service:
    name: timecard-sma
    enabled: true
    daemon_reload: true
  # In --check on a fresh host the unit file hasn't been written yet.
  ignore_errors: "{{ ansible_check_mode }}"
