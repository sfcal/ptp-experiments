---
# Client-side chrony: discipline CLOCK_REALTIME from the NIC PHC refclock.
- name: Install chrony.
  ansible.builtin.apt:
    name: chrony
    state: present

- name: Remove any default pool/server lines.
  ansible.builtin.replace:
    dest: /etc/chrony/chrony.conf
    regexp: '^(pool|server)\s+.*\.(pool\.ntp\.org|ubuntu\.com).*$'
    replace: '# \1 (removed by Ansible)'
  notify: Restart chrony

- name: Remove Ubuntu default NTP sources (sources.d).
  ansible.builtin.file:
    path: /etc/chrony/sources.d/ubuntu-ntp-pools.sources
    state: absent
  notify: Restart chrony

- name: Add NIC PHC refclock.
  ansible.builtin.template:
    src: templates/chrony/client-refclock.conf.j2
    dest: /etc/chrony/conf.d/client-refclock.conf
    mode: 0644
  notify: Restart chrony

- name: Ensure chrony is running.
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
