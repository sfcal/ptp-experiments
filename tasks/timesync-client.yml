---
# Nothing may fight phc2sys for the system clock on clients.
- name: Stop and disable systemd-timesyncd.
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: stopped
    enabled: false
  failed_when: false  # unit may not exist on all images

- name: Ensure chrony is not installed.
  ansible.builtin.apt:
    name: chrony
    state: absent
    purge: true
