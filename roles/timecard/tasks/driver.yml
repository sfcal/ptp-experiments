---
# Build and install the ptp_ocp driver from DRV/ (out-of-tree, PTM-capable;
# see DRV/README.md). remake compiles against the running kernel's headers,
# installs ptp_ocp.ko under /lib/modules/<kver>/updates/, and runs depmod.

- name: Install kernel build prerequisites.
  ansible.builtin.apt:
    name:
      - build-essential
      - "linux-headers-{{ ansible_kernel }}"
    state: present

- name: Create the driver build directory.
  ansible.builtin.file:
    path: "/usr/local/src/ptp_ocp"
    state: directory
    mode: "0755"

- name: Copy the driver sources.
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/DRV/{{ item }}"
    dest: "/usr/local/src/ptp_ocp/{{ item }}"
    mode: preserve
  loop:
    - Makefile
    - ptp_ocp.c
    - remake
  register: ptp_ocp_sources

# The install path is per-kernel, so a kernel upgrade also retriggers this.
- name: Check for an installed module for this kernel.
  ansible.builtin.stat:
    path: /lib/modules/{{ ansible_kernel }}/updates/ptp_ocp.ko
  register: ptp_ocp_installed

- name: Build and install ptp_ocp.ko for the running kernel.
  ansible.builtin.command:
    cmd: ./remake install
    chdir: "/usr/local/src/ptp_ocp"
  when: ptp_ocp_sources.changed or not ptp_ocp_installed.stat.exists

# Rewrite the netboot-staged blacklist now that the working driver is on
# disk: ptp_ocp comes off it, spi_nor goes on. spi_nor's probe of the
# Timecard's flash hangs forever in the Xilinx SPI controller -- the TAP
# PTM image does not service it -- leaving an unkillable D-state process
# that wedges every later shutdown. Costs firmware flashing from Linux,
# which we do not do. The initramfs rebuild below carries this into every
# subsequent boot.
- name: Keep spi_nor blacklisted while allowing ptp_ocp.
  ansible.builtin.copy:
    dest: /etc/modprobe.d/blacklist-timecard.conf
    content: |
      # Managed by Ansible (roles/timecard). The TAP PTM FPGA image does not
      # service the SPI flash controller; spi_nor's probe hangs in D state.
      blacklist spi_nor
    owner: root
    group: root
    mode: "0644"
  register: installer_blacklist_updated

# udev workers autoload modules in-process via libkmod, whose config was
# read when udevd started -- writing the file above does not update the
# running daemon until it reloads (verified 2026-08-27: post-reload
# triggers do honor a new blacklist entry).
- name: Reload udev so autoloads honor the rewritten blacklist.
  ansible.builtin.command:
    cmd: udevadm control --reload
  when: installer_blacklist_updated.changed

# The blacklist alone cannot protect the first boot: spi-intel exposes the
# PCH BIOS flash as an spi device with the same "spi-nor" modalias, so the
# installer's boot loads spi_nor (t+5s) before this role ever runs, and a
# RESIDENT driver binds new devices synchronously at registration -- no
# autoload, no blacklist consulted. That was the 2026-08-27 provisioning
# wedge: ptp_ocp's flash registration was grabbed by the resident spi_nor
# inside a udev worker (JEDEC read, D-state, systemd-shutdown waiting on
# it forever). Evict it before ptp_ocp can offer it a device; the
# BIOS-flash mtd is unused, so removal is free, and the rebuilt initramfs
# keeps it out of later boots.
- name: Unload spi_nor before ptp_ocp registers the Timecard flash.
  community.general.modprobe:
    name: spi_nor
    state: absent

# The autoinstall baked its blacklist into the initramfs, so rebuild after
# changing the file. -k all: every installed kernel's initramfs carries it.
- name: Rebuild initramfs with the updated blacklist.
  ansible.builtin.command:
    cmd: update-initramfs -u -k all
  when: installer_blacklist_updated.changed

# Set for Deploy to reboot before continuing
- name: Flag a reboot when the initramfs blacklist changed.
  ansible.builtin.set_fact:
    timecard_reboot_required: true
  when: installer_blacklist_updated.changed

- name: Load the ptp_ocp driver.
  community.general.modprobe:
    name: ptp_ocp
    state: present
