---
# Build and install the ptp_ocp driver from this role's files/src/
# (out-of-tree, PTM-capable; see README.md alongside). remake compiles
# against a kernel's headers, installs ptp_ocp.ko under
# /lib/modules/<kver>/updates/, and runs depmod.
#
# Built for EVERY bootable kernel (linux-version list: each vmlinuz in
# /boot), not just the running one. unattended-upgrades installs kernels
# unprompted and GRUB boots the newest, so a running-kernel-only build
# leaves the next boot on the stock in-tree ptp_ocp, which cannot drive the
# PTM FPGA image (all-ones registers, EOPNOTSUPP on every SMA write,
# chronyd/ts2phc chasing garbage). 2026-10-08: the GM booted 7.0.0-34 with
# no build for it, and 7.0.0-38 was installed while the recovery deploy ran.

- name: List bootable kernels (every version with a vmlinuz in /boot).
  ansible.builtin.command:
    cmd: linux-version list
  register: timecard_kernel_list
  changed_when: false
  check_mode: false

# The running kernel is normally in the list; keep it even if its image
# package has gone (apt never removes the running kernel, but be safe).
- name: Collect the kernels to build for.
  ansible.builtin.set_fact:
    timecard_kernels: "{{ (timecard_kernel_list.stdout_lines + [ansible_kernel]) | unique }}"

- name: Install kernel build prerequisites and headers for every bootable kernel.
  ansible.builtin.apt:
    name: "{{ ['build-essential'] + (timecard_kernels | map('regex_replace', '^', 'linux-headers-') | list) }}"
    state: present

- name: Create the driver build directory.
  ansible.builtin.file:
    path: "/usr/local/src/ptp_ocp"
    state: directory
    mode: "0755"

- name: Copy the driver sources.
  ansible.builtin.copy:
    src: "src/{{ item }}"
    dest: "/usr/local/src/ptp_ocp/{{ item }}"
    mode: preserve
  loop:
    - Makefile
    - ptp_ocp.c
    - remake
  register: ptp_ocp_sources

# The install path is per-kernel, so a new kernel also triggers a build.
- name: Check for an installed module for each bootable kernel.
  ansible.builtin.stat:
    path: "/lib/modules/{{ item }}/updates/ptp_ocp.ko"
  loop: "{{ timecard_kernels }}"
  register: ptp_ocp_installed

# One build directory serves every kernel, so clean between targets:
# kbuild would otherwise reuse objects compiled against another kernel's
# headers. Skipped in check mode: the shell module validates chdir even
# then, and a fresh host has no build directory yet.
- name: Build and install ptp_ocp.ko for each kernel that lacks a current one.
  ansible.builtin.shell:
    cmd: ./remake clean && ./remake install
    chdir: "/usr/local/src/ptp_ocp"
  environment:
    KVER: "{{ item.item }}"
  loop: "{{ ptp_ocp_installed.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: >-
    not ansible_check_mode
    and (ptp_ocp_sources.changed or not item.stat.exists)
  register: ptp_ocp_build

# initramfs-tools copies /lib/modules/<kver>/updates/ into that kernel's
# initramfs, and early-boot udev loads ptp_ocp from there -- so without a
# refresh the initramfs keeps booting the previous build.
- name: Rebuild the initramfs of every kernel that got a new ptp_ocp.ko.
  ansible.builtin.command:
    cmd: update-initramfs -u -k {{ item }}
  loop: "{{ ptp_ocp_build.results | selectattr('changed') | map(attribute='item.item') | list }}"

# Rewrite the netboot-staged blacklist now that the working driver is on
# disk: ptp_ocp comes off it, spi_nor goes on. spi_nor's probe of the
# Timecard's flash hangs forever in the Xilinx SPI controller -- the TAP
# PTM image does not service it -- leaving an unkillable D-state process
# that wedges every later shutdown. Costs firmware flashing from Linux,
# which we do not do. The initramfs rebuild below carries this into every
# subsequent boot.
- name: Keep spi_nor blacklisted while allowing ptp_ocp.
  ansible.builtin.copy:
    dest: /etc/modprobe.d/blacklist-timecard.conf
    content: |
      # Managed by Ansible (roles/timecard). The TAP PTM FPGA image does not
      # service the SPI flash controller; spi_nor's probe hangs in D state.
      blacklist spi_nor
    owner: root
    group: root
    mode: "0644"
  register: installer_blacklist_updated

# udev workers autoload modules in-process via libkmod, whose config was
# read when udevd started -- writing the file above does not update the
# running daemon until it reloads (verified 2026-08-27: post-reload
# triggers do honor a new blacklist entry).
- name: Reload udev so autoloads honor the rewritten blacklist.
  ansible.builtin.command:
    cmd: udevadm control --reload
  when: installer_blacklist_updated.changed

# The blacklist alone cannot protect the first boot: spi-intel exposes the
# PCH BIOS flash as an spi device with the same "spi-nor" modalias, so the
# installer's boot loads spi_nor (t+5s) before this role ever runs, and a
# RESIDENT driver binds new devices synchronously at registration -- no
# autoload, no blacklist consulted. That was the 2026-08-27 provisioning
# wedge: ptp_ocp's flash registration was grabbed by the resident spi_nor
# inside a udev worker (JEDEC read, D-state, systemd-shutdown waiting on
# it forever). Evict it before ptp_ocp can offer it a device; the
# BIOS-flash mtd is unused, so removal is free, and the rebuilt initramfs
# keeps it out of later boots.
- name: Unload spi_nor before ptp_ocp registers the Timecard flash.
  community.general.modprobe:
    name: spi_nor
    state: absent

# The autoinstall baked its blacklist into the initramfs, so rebuild after
# changing the file. -k all: every installed kernel's initramfs carries it.
- name: Rebuild initramfs with the updated blacklist.
  ansible.builtin.command:
    cmd: update-initramfs -u -k all
  when: installer_blacklist_updated.changed

# Set for deploy.yml's shared reboot task (also fed by roles/igc_ppsfix).
- name: Flag a reboot when the initramfs blacklist changed.
  ansible.builtin.set_fact:
    reboot_required: true
  when: installer_blacklist_updated.changed

- name: Load the ptp_ocp driver.
  community.general.modprobe:
    name: ptp_ocp
    state: present

# A no-op above whenever some ptp_ocp is already loaded -- which, after a
# kernel upgrade, is the STOCK in-tree one (loaded at boot because no build
# existed for the new kernel yet). It cannot drive the PTM FPGA image:
# sysfs reads all-ones, every SMA write fails with EOPNOTSUPP, and
# chronyd/ts2phc chase garbage. The module is pinned by gpsd (ttyGNSS) and
# chrony (the PHC), so it is not reloaded live: flag deploy.yml's shared
# reboot and let tasks/main.yml skip the SMA routing until then. Compared
# by srcversion, the same way roles/igc_ppsfix does.
- name: Read srcversion of the on-disk ptp_ocp module for the running kernel.
  ansible.builtin.command:
    cmd: modinfo -k {{ ansible_kernel }} -F srcversion ptp_ocp
  register: ptp_ocp_disk_srcver
  changed_when: false
  check_mode: false
  # In --check on a fresh host nothing has been built yet.
  failed_when: false

# Missing when ptp_ocp is not loaded (fresh host: the modprobe above loads
# the build just installed, so it cannot be stale).
- name: Read srcversion of the running ptp_ocp module.
  ansible.builtin.slurp:
    src: /sys/module/ptp_ocp/srcversion
  register: ptp_ocp_live_srcver
  failed_when: false

- name: Determine whether the running ptp_ocp matches the on-disk build.
  ansible.builtin.set_fact:
    timecard_driver_stale: >-
      {{ ptp_ocp_live_srcver.content is defined and
         (ptp_ocp_live_srcver.content | b64decode | trim)
         != (ptp_ocp_disk_srcver.stdout | trim) }}

# Set true-only, never false: the fact is shared with roles/igc_ppsfix.
- name: Flag a reboot to replace the stale ptp_ocp.
  ansible.builtin.set_fact:
    reboot_required: true
  when: timecard_driver_stale

- name: Warn that the running ptp_ocp is not the on-disk build.
  ansible.builtin.debug:
    msg: >-
      The RUNNING ptp_ocp (srcversion
      {{ ptp_ocp_live_srcver.content | default('') | b64decode | trim }})
      is not the on-disk build ({{ ptp_ocp_disk_srcver.stdout | trim }}).
      After a kernel upgrade that is the stock in-tree driver, which cannot
      drive the Timecard: SMA routing is skipped and deploy.yml reboots next
      (defer with --skip-tags reboot).
  when: timecard_driver_stale
