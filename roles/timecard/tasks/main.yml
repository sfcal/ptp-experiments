---
# Timecard udev rules and SMA input/output routing via the ptp_ocp sysfs
# interface. The udev rules are deployed unconditionally: chrony and ts2phc
# depend on the stable /dev/ptp-timecard and /dev/pps-timecard symlinks even
# when no SMA routing is configured. Sysfs writes do not survive a reboot,
# so a oneshot systemd unit reapplies the configured mapping at boot; the
# handler applies it at deploy time.

- name: Deploy Timecard udev rules (stable /dev/ptp-timecard and /dev/pps-timecard).
  ansible.builtin.copy:
    src: timecard-ptp.rules
    dest: /etc/udev/rules.d/99-timecard-ptp.rules
    owner: root
    group: root
    mode: "0644"
  register: timecard_udev

- name: Reload udev and apply the Timecard symlink rules.
  ansible.builtin.shell:
    cmd: udevadm control --reload && udevadm trigger --subsystem-match=ptp --subsystem-match=pps
  when: timecard_udev.changed

- name: Deploy Timecard SMA routing script.
  ansible.builtin.template:
    src: timecard-sma.sh.j2
    dest: /usr/local/bin/timecard-sma.sh
    owner: root
    group: root
    mode: "0755"
  notify: Run timecard-sma
  when: timecard_sma is defined

- name: Deploy Timecard SMA systemd unit.
  ansible.builtin.template:
    src: timecard-sma.service.j2
    dest: /etc/systemd/system/timecard-sma.service
    owner: root
    group: root
    mode: "0644"
  notify: Run timecard-sma
  when: timecard_sma is defined

# Enable only: first-time activation and config changes both go through the
# handler, whose 'restarted' state re-runs the RemainAfterExit oneshot.
- name: Ensure timecard-sma runs at boot.
  ansible.builtin.systemd_service:
    name: timecard-sma
    enabled: true
    daemon_reload: true
  when: timecard_sma is defined
  # In --check on a fresh host the unit file hasn't been written yet.
  ignore_errors: "{{ ansible_check_mode }}"
