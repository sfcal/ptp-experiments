---
- name: Build ptp_ocp driver from source.
  ansible.builtin.include_tasks: driver.yml

- name: Deploy Timecard SMA routing script.
  ansible.builtin.template:
    src: timecard-sma.sh.j2
    dest: /usr/local/bin/timecard-sma.sh
    owner: root
    group: root
    mode: "0755"
  notify: Run timecard-sma
  when: timecard_sma is defined

- name: Deploy Timecard SMA systemd unit.
  ansible.builtin.template:
    src: timecard-sma.service.j2
    dest: /etc/systemd/system/timecard-sma.service
    owner: root
    group: root
    mode: "0644"
  notify: Run timecard-sma

- name: Configure GPS.
  ansible.builtin.include_tasks: gps.yml

