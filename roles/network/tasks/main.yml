---
# Pins the PTP interface to a static address. Without this, enp1s0 is
# unmanaged by netplan and falls through to dracut's catch-all DHCP.
- name: Deploy static netplan configuration.
  ansible.builtin.template:
    src: netplan-static.yaml.j2
    dest: /etc/netplan/50-static.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Apply netplan
