---
# Metrics only: node_exporter. Prometheus and the exporters' scraping stay
# on the grandmaster, which scrapes us. The ptp-metrics textfile collector
# is deployed by the shared ptp_metrics role.
- name: Deploy node exporter.
  when: monitoring_enabled
  block:
    - name: Install node exporter.
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present

    - name: Ensure node exporter is running.
      ansible.builtin.service:
        name: prometheus-node-exporter
        state: started
        enabled: true
