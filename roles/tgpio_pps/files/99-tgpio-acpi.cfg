# Managed by Ansible (roles/tgpio_pps).
# Prepend the ACPI table-upgrade archive (the TGPIO gate-bypass SSDT) to
# every kernel entry's initrd. 10_linux only lists archives that exist in
# /boot at update-grub time, so a missing archive degrades to a plain boot,
# not a broken one.
GRUB_EARLY_INITRD_LINUX_CUSTOM="acpi-tgpio.cpio"
