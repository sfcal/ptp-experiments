---
# TAPR TICC (time-interval counter) capture support. The TICC is an Arduino
# Mega 2560 shield on USB serial; cdc_acm autoloads from the modalias, so
# "install" is just the capture tooling, a stable device name, and the log
# directory. Captures run on demand via the `ticc.sh` CLI (start/stop/reset,
# one timestamped file per run -- see analysis/README.md); nothing captures
# at boot.

- name: Install the TICC serial symlink udev rule.
  ansible.builtin.template:
    src: 99-ticc.rules.j2
    dest: /etc/udev/rules.d/99-ticc.rules
    owner: root
    group: root
    mode: "0644"
  register: ticc_udev_rule

- name: Reload udev after the rule change.
  ansible.builtin.command:
    cmd: udevadm control --reload
  when: ticc_udev_rule.changed

- name: Re-evaluate tty devices so the symlink appears now.
  ansible.builtin.command:
    cmd: udevadm trigger --settle --subsystem-match=tty
  when: ticc_udev_rule.changed

- name: Add the capture user to dialout for sudo-less serial access.
  ansible.builtin.user:
    name: "{{ ticc_user }}"
    groups: dialout
    append: true

- name: Create the TICC capture directory (mutagen sync source).
  ansible.builtin.file:
    path: /var/log/ticc
    state: directory
    owner: "{{ ticc_user }}"
    group: "{{ ticc_user }}"
    mode: "0755"

- name: Deploy the capture worker script.
  ansible.builtin.copy:
    src: ticc-capture.sh
    dest: /usr/local/bin/ticc-capture.sh
    owner: root
    group: root
    mode: "0755"

- name: Deploy the ticc control CLI.
  ansible.builtin.copy:
    src: ticc.sh
    dest: /usr/local/bin/ticc.sh
    owner: root
    group: root
    mode: "0755"

# Daemon-reload only: a deploy must never restart a running capture.
- name: Install the ticc-capture@ template unit.
  ansible.builtin.template:
    src: ticc-capture@.service.j2
    dest: /etc/systemd/system/ticc-capture@.service
    owner: root
    group: root
    mode: "0644"
  register: ticc_capture_unit

- name: Reload systemd for the unit change.
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: ticc_capture_unit.changed
