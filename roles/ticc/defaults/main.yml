---
# TAPR TICC capture support on the GM: picocom, a stable /dev/ticc serial
# symlink, and the /var/log/ticc capture directory that mutagen syncs into
# analysis/data/raw (see analysis/README.md and mutagen.yml). deploy.yml
# gates the whole role on ticc_enabled.
ticc_enabled: true

# USB identity of the TICC's Arduino Mega 2560 base board (lsusb 2341:0042).
ticc_usb_vendor: "2341"
ticc_usb_product: "0042"

# Board serial (udevadm info -q property /dev/ttyACMn -> ID_SERIAL_SHORT).
# Pins the symlink to this exact unit so ttyACM renumbering and stray
# Arduinos can't move it; "" matches any Mega 2560.
ticc_usb_serial: "14532303232351F01151"

# Capture user; owns the log directory so sudo-less captures can write it
# and mutagen (syncing as the same user) can read it.
ticc_user: "{{ ansible_user }}"
