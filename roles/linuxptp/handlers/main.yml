---
# Restart every service that runs a binary from the linuxptp build. The
# list is host-specific: clients run only ptp4l, the grandmaster's active
# pipeline profile adds ts2phc or phc2sys.
- name: Restart linuxptp services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop: "{{ linuxptp_managed_services }}"
