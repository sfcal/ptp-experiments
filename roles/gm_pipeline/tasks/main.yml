---
# Grandmaster NIC-PHC discipline leg, selected by gm_pipeline (deploy.yml
# loads vars/gm_pipelines/{{ gm_pipeline }}.yml). Each leg tears its service
# down when disabled, so switching profiles converges instead of
# accumulating: the losing service is stopped, disabled, and its unit file
# removed.

- name: Assert exactly one pipeline discipline leg is enabled.
  ansible.builtin.assert:
    that:
      - (gm_ts2phc_enabled | bool) != (gm_phc2sys_enabled | bool)
    fail_msg: >-
      The gm_pipeline profile must enable exactly one of gm_ts2phc_enabled /
      gm_phc2sys_enabled (check vars/gm_pipelines/{{ gm_pipeline }}.yml).

# --- ts2phc leg (hardware: Timecard PPS -> NIC SDP) ------------------------

- name: Copy ts2phc systemd unit file into place.
  ansible.builtin.template:
    src: ts2phc.service.j2
    dest: /etc/systemd/system/ts2phc.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart ts2phc
  when: gm_ts2phc_enabled

- name: Ensure ts2phc service is in the correct state.
  ansible.builtin.service:
    name: ts2phc
    state: "{{ ts2phc_service_state }}"
    enabled: "{{ ts2phc_service_enabled }}"
  when: gm_ts2phc_enabled

- name: Stop and disable ts2phc (not in the active profile).
  ansible.builtin.systemd_service:
    name: ts2phc
    state: stopped
    enabled: false
  failed_when: false  # unit may not exist
  when: not gm_ts2phc_enabled

- name: Remove ts2phc unit file (not in the active profile).
  ansible.builtin.file:
    path: /etc/systemd/system/ts2phc.service
    state: absent
  register: gm_ts2phc_unit_removed
  when: not gm_ts2phc_enabled

# --- phc2sys leg (software: CLOCK_REALTIME -> NIC PHC) ---------------------

- name: Copy phc2sys systemd unit file into place.
  ansible.builtin.template:
    src: phc2sys.service.j2
    dest: /etc/systemd/system/phc2sys.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart phc2sys
  when: gm_phc2sys_enabled

- name: Ensure phc2sys service is in the correct state.
  ansible.builtin.service:
    name: phc2sys
    state: "{{ phc2sys_service_state }}"
    enabled: "{{ phc2sys_service_enabled }}"
  when: gm_phc2sys_enabled

- name: Stop and disable phc2sys (not in the active profile).
  ansible.builtin.systemd_service:
    name: phc2sys
    state: stopped
    enabled: false
  failed_when: false  # unit may not exist
  when: not gm_phc2sys_enabled

- name: Remove phc2sys unit file (not in the active profile).
  ansible.builtin.file:
    path: /etc/systemd/system/phc2sys.service
    state: absent
  register: gm_phc2sys_unit_removed
  when: not gm_phc2sys_enabled

- name: Reload systemd after removing inactive pipeline units.
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: gm_ts2phc_unit_removed.changed or gm_phc2sys_unit_removed.changed
