---
- name: Install chrony.
  ansible.builtin.apt:
    name: chrony
    state: present

- name: Remove Ubuntu default NTP sources (sources.d).
  ansible.builtin.file:
    path: /etc/chrony/sources.d/ubuntu-ntp-pools.sources
    state: absent
  notify: Restart chrony

- name: Customize chrony configuration.
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/chrony/conf.d/{{ item }}"
    mode: "0644"
  loop:
    - allow.conf
    - refclock.conf
  notify: Restart chrony

- name: Deploy chrony sources.
  ansible.builtin.template:
    src: servers.sources.j2
    dest: /etc/chrony/sources.d/servers.sources
    mode: "0644"
  notify: Reload chrony sources

- name: Ensure chrony is running.
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
