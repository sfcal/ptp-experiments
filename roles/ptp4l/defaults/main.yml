---
ptp4l_service_state: started
ptp4l_service_enabled: true

# How the /dev/ptp-nic udev rule identifies the PTP NIC's PHC:
#   driver -- match the parent driver name (nic_phc_driver); only safe with
#             a single NIC of that driver on the host
#   pci    -- match the NIC's PCI address (nic_phc_pci); required on hosts
#             with two NICs of the same driver
nic_phc_match: driver

# Role-specific ptp4l.conf directives appended to the shared header
# (grandmaster: masterOnly/clockClass/...; clients: slaveOnly/quirks).
# Set per group/host in group_vars / host_vars.
ptp4l_conf_extra: ""
