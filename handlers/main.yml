---
- name: Restart chrony
  ansible.builtin.service:
    name: chrony
    state: restarted

- name: Restart gpsd
  ansible.builtin.service:
    name: gpsd
    state: restarted

- name: Apply netplan
  ansible.builtin.command:
    cmd: netplan apply
  changed_when: true

# Oneshot with RemainAfterExit: 'restarted' forces a re-run. Defined before
# the PTP handlers so SMA routing is applied before ts2phc/ptp4l restart
# (handlers fire in file order, not notification order).
- name: Run timecard-sma
  ansible.builtin.systemd_service:
    name: timecard-sma
    state: restarted
    daemon_reload: true
  when: ptp_role == 'grandmaster'
  # In --check on a fresh host the unit file hasn't been written yet.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Restart ptp4l
  ansible.builtin.systemd_service:
    name: ptp4l
    state: restarted
    daemon-reload: true
    
# The ts2phc unit only exists on the grandmaster.
- name: Restart ts2phc
  ansible.builtin.systemd_service:
    name: ts2phc
    state: restarted
    daemon-reload: true
  when: ptp_role == 'grandmaster'

- name: Restart monitoring-stack
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_deploy_path }}"
    state: restarted
  when: monitoring_enabled

# Rule-file changes only need Prometheus bounced, not the whole stack.
- name: Restart prometheus
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring_deploy_path }}"
    services:
      - prometheus
    state: restarted
  when: monitoring_enabled