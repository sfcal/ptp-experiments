---
system_timezone: Europe/London

# PTP runs on each host's primary NIC; override per group/host if needed.
ptp4l_ptp_iface: "{{ network_interface }}"

# linuxptp is built from source on each host for the latest features.
# Install paths are hardcoded in the roles, deliberately not variables:
# source builds live in /usr/local/src/<name> and install to
# /usr/local/sbin (FHS 3.0 4.9.1/4.9.2 and 3.16.1). Only the version pins
# below are tunable.
linuxptp_repo: git://git.code.sf.net/p/linuxptp/code
linuxptp_version: f98cb5de87e63696599c59d0a9df7dc04d08d40d

# igc-ppsfix DKMS driver (I226 PPS fixes). Shared here because both the
# grandmaster (TimeNIC) and clients with i226 NICs can use it; enable per
# host/group with igc_ppsfix_enabled.
igc_ppsfix_version: "7.0.0-ppsfix.1"  # must match igc-ppsfix/dkms/dkms.conf
igc_ppsfix_deploy_path: /opt/igc-ppsfix

# ptp-ocp-gnsspps DKMS driver: the Time-Appliances-Project PTM-capable
# ptp_ocp (the card runs a PTM FPGA image the mainline driver cannot drive
# -- it wedges udev), plus the gnss_pps raw-PPS patch. Grandmaster only;
# enable with ptp_ocp_gnsspps_enabled. Version = TAP repo commit + patch rev.
ptp_ocp_gnsspps_version: "tap-1042bd6f-gnsspps.1"  # must match ptp-ocp-gnsspps/dkms/dkms.conf
ptp_ocp_gnsspps_deploy_path: /opt/ptp-ocp-gnsspps

# ptp_ocp driver built from source (DRV/): out-of-tree PTM-capable build,
# compiled on the host by DRV's remake script. Built in /usr/local/src/ptp_ocp
# by roles/timecard/tasks/driver.yml; installs to /lib/modules/<kver>/updates/.
# Supersedes the ptp-ocp-gnsspps DKMS approach.
