---
# Grandmaster: GNSS Timecard -> ts2phc -> ptp4l (masterOnly).
ptp_role: grandmaster

network_interface: "enp1s0"

# Driver owning the PHC that ptp4l serves on the TimeNIC (udev DRIVERS
# match for the /dev/ptp-nic symlink).
nic_phc_driver: igc

# GPSd configuration. /dev/pps-timecard is the Timecard's kernel PPS device
# (udev symlink, files/timecard-ptp.rules); with the ptp-ocp-gnsspps DKMS
# module loaded it carries the raw GNSS receiver 1PPS, which gpsd pairs with
# the NMEA time from ttyS7 and reports as class PPS (-> gpsd-exporter ->
# Grafana "Clock offset from PPS" panels).
gpsd_state: started
gpsd_enabled: true
gpsd_devices: "/dev/ttyS7 /dev/pps-timecard"
gpsd_baud: "115200"
gpsd_options: "-s {{ gpsd_baud }} -n"

# igc-ppsfix DKMS driver (TimeNIC I226 PPS fixes, see igc-ppsfix/README.md).
# Installed on disk only -- loads at the next reboot. Ansible flags
# /run/reboot-required and never reloads igc live (enp1s0 is the igc NIC).
igc_ppsfix_enabled: true
igc_ppsfix_auto_reboot: false  # opt-in: let Ansible reboot when a new build is staged

# ptp-ocp-gnsspps DKMS driver (raw GNSS PPS on the Timecard kernel PPS device,
# see ptp-ocp-gnsspps/README.md). Same conventions as igc-ppsfix: installed on
# disk only, loads at the next reboot, /run/reboot-required flagged. Until the
# reboot, /dev/pps-timecard carries the disciplined FPGA PPS (stock driver).
ptp_ocp_gnsspps_enabled: true
ptp_ocp_gnsspps_auto_reboot: false

# Enable kernel PPS events on the Timecard PHC at boot (PTP_ENABLE_PPS ioctl
# in timecard-sma.sh). Without this, /dev/pps-timecard exists but never
# asserts.
timecard_kernel_pps: true

# gpsd-exporter PPS histogram (gpsd_pps_histogram_bucket, used by the GPSD
# dashboard's "Clock offset from PPS" panels). Bucket span = size * count,
# centered on 0: 1000 ns x 40 = +/-20 us -- PPS asserts are timestamped by
# the system clock at IRQ time, so interrupt latency dominates the spread.
gpsd_exporter_pps_bucket_ns: 1000
gpsd_exporter_pps_bucket_count: 40

# Timecard SMA routing (ptp_ocp sysfs). Writes don't persist across reboot,
# so a systemd oneshot (timecard-sma.service) reapplies them at boot.
# Only keys listed under timecard_sma are written; see
# /sys/class/timecard/<dev>/available_sma_inputs and available_sma_outputs
# on the host for the accepted values.
timecard_device: ocp0
timecard_sma_wait_timeout: 30  # seconds to wait for the sysfs node at boot
timecard_sma:
  sma1: "OUT: PHC"    # FPGA PPS out -> cable to TimeNIC PPS IN
  sma2: "OUT: 10Mhz"
  sma3: "OUT: PHC"     

# Enable NIC hardware timestamping for NTP clients (hwtimestamp * in
# refclock.conf).
chrony_hwtimestamp: true

# Refclock to be used as a time source.
# See: https://chrony-project.org/doc/3.4/chrony.conf.html#refclock
chrony_refclock: |
  # Uncomment to use Timecard PHC as time source. /dev/ptp-timecard is a
  # udev symlink (files/timecard-ptp.rules) that survives NIC swaps.
  # nocrossts: PCIe PTM cross-timestamping on the Timecard link can die at
  # runtime ("Exceeded number of tries for PTM cycle" in dmesg); chrony then
  # never falls back and the refclock goes unreachable (seen 2026-08-04).
  # Plain extended reads are sub-us and immune to PTM state.
  refclock PHC /dev/ptp-timecard:nocrossts poll 0 refid AC precision 1e-9 tai prefer

  # Uncomment to use NIC's PHC as time source.
  # refclock PHC /dev/ptp-nic poll 0 dpoll -5 tai  # Use NIC's PHC

  # Monitor (but never select) the NIC PHC that ptp4l serves to clients.
  refclock PHC /dev/ptp-nic poll 0 dpoll -5 tai noselect refid NIC

  # Uncomment to use GPS module directly as time source.
  #refclock SHM 0 refid NMEA precision 1e-3 poll 0 filter 3

  # Uncomment to use PPS source (e.g. GPS PPS to GPIO pin 18)
  #refclock PPS /dev/pps0 refid PPS lock NMEA poll 3 trust

  # Uncomment to log timing statistics.
  #log tracking measurements statistics

# Hosts allowed to query chrony for NTP time.
# See: https://chrony-project.org/doc/3.4/chrony.conf.html#allow
chrony_allow: "10.3.0.0/16"

# NTP upstream servers
chrony_servers:
  - ntp1.npl.co.uk
  - ntp2.npl.co.uk
  - ntp3.npl.co.uk
  - ntp4.npl.co.uk
  - ntp5.npl.co.uk
  - time.cloudflare.com

chrony_server_options: iburst xleave

# Services restarted after a linuxptp rebuild (see roles/linuxptp).
linuxptp_managed_services:
  - ptp4l
  - ts2phc

# Grandmaster-specific ptp4l.conf directives (appended to the shared header
# in roles/ptp4l/templates/ptp4l.conf.j2).
ptp4l_conf_extra: |
  # Act only as a master. ('serverOnly' on later versions...)
  masterOnly 1

  # BMCA priorities (lower wins)
  priority1 127
  priority2 127

  # clockClass=6 for GNSS reference
  # other classes = https://documentation.nokia.com/srlinux/24-10/books/network-synchronization/ieee-1588-ptp.html
  clockClass 6

  # 0x20 = time accurate to within 25ns
  clockAccuracy 0x20

  # Sync message rate: 2^-3 = 8 msgs/sec
  logSyncInterval -3

  # Announce message rate: 2^0 = 1 msg/sec
  logAnnounceInterval 0

# The NIC PHC (/dev/ptp0, served by ptp4l) is synced from the Timecard by
# ts2phc: Timecard 1PPS -> TimeNIC SDP1, hardware edge timestamping (~6 ns
# rms on the TICC). Needs the igc-ppsfix driver loaded, an SMA cable from
# Timecard PPS OUT to TimeNIC PPS IN, and timecard_sma routing "OUT: PHC"
# on the cabled connector (bench-check: testptp shows extts events).
ts2phc_service_state: started
ts2phc_service_enabled: true
ts2phc_logging_level: 7
ts2phc_clock: '/dev/ptp-nic'  # NIC PHC, disciplined by the Timecard's PPS
ts2phc_source: 'generic'
ts2phc_pin_index: 1  # TimeNIC SDP1 = PPS IN
ts2phc_extra_opts: '-m'
# ts2phc's generic source aligns second edges only; the unit coarse-sets the
# NIC PHC from the Timecard first so the absolute (TAI) seconds are right.
ts2phc_presync_source: '/dev/ptp-timecard'
ts2phc_presync_timeout: 10

# Monitoring stack (Grafana + Prometheus + exporters) running in Docker.
monitoring_deploy_path: /opt/monitoring
monitoring_uid: "1000"
monitoring_gid: "1000"

# Where ptp-metrics.sh writes node_exporter textfile metrics.
ptp_metrics_textfile_dir: "{{ monitoring_deploy_path }}/textfile"

grafana_image: "grafana/grafana:13.1.1"
grafana_port: 3000
grafana_admin_user: admin
grafana_admin_password: changeme  # Change me before deploying.

prometheus_image: "prom/prometheus:v3.13.1"
prometheus_port: 9090
prometheus_retention: 30d

chrony_exporter_image: "quay.io/superq/chrony-exporter:v0.13.3"
node_exporter_image: "prom/node-exporter:v1.12.1"
gpsd_exporter_image: "ghcr.io/brendanbank/gpsd-prometheus-exporter:latest"
