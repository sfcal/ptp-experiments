---
# PTP clients (Raspberry Pi): ptp4l disciplines the NIC PHC from the
# grandmaster, chrony steers the system clock from the PHC refclock.
ptp_role: slave

network_interface: "eth0"

# Driver owning the PHC that ptp4l uses on this NIC (udev DRIVERS match for
# the /dev/ptp-nic symlink). Pi 5 onboard = the Broadcom PHY; hosts with an
# i226 PTP NIC override with "igc" (see host_vars/10.3.30.12.yml).
nic_phc_driver: "Broadcom BCM54213PE"

# Client-specific ptp4l.conf directives (appended to the shared header in
# roles/ptp4l/templates/ptp4l.conf.j2).
ptp4l_conf_extra: |
  # Act only as a slave. ('clientOnly' on later versions...)
  slaveOnly 1

  # CM5/RP1 NIC only hardware-timestamps PTPv2.0 frames; linuxptp 4.x
  # sends v2.1 by default, so force minor version 0.
  # See: https://github.com/jclark/rpi-cm4-ptp-guide/issues/40
  ptp_minor_version 0

  # The RP1 driver can be slow returning TX timestamps (default is 1ms).
  tx_timestamp_timeout 100

# chrony's median-filtered PHC refclock disciplines CLOCK_REALTIME. The
# filtering wins on every read path we measured (2026-08-04): ~8 ns rms on
# the i226's fast PCIe reads, and still ~63 ns rms on the Pi 5 onboard PHY
# whose PHC sits behind ~214 us MDIO reads.
# PHC holds TAI; 'tai' converts via the leapseclist already present in
# Ubuntu's base chrony.conf. dpoll -4 = 16 reads/s, median-filtered.
chrony_refclock: "refclock PHC /dev/ptp-nic poll 0 dpoll -4 refid PHC tai prefer"

# apt prometheus-node-exporter's textfile collector directory.
ptp_metrics_textfile_dir: /var/lib/prometheus/node-exporter
