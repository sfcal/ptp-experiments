---
# Grandmaster: GNSS Timecard -> ts2phc -> ptp4l (masterOnly).
ptp_role: grandmaster

network_interface: "enp1s0"

# The GM has TWO igc NICs (TimeNIC enp1s0 + enp3s0). ts2phc/phc2sys target
# the TimeNIC by interface name (ethtool resolves its PHC), so no udev
# symlink or PCI matcher is needed; only chrony's NIC refclock still names
# a raw /dev/ptpN (see chrony_refclock below).

# GPSd configuration. /dev/pps2 is the Timecard PHC's kernel PPS device
# (enabled by timecard-sma.sh), which gpsd pairs with the NMEA time from
# ttyS7 and reports as class PPS (-> gpsd-exporter -> Grafana "Clock offset
# from PPS" panels). Device numbering follows driver probe order -- update
# by hand if a NIC change renumbers /dev/ptpN//dev/ppsN (the Timecard's is
# the ppsN whose /sys/class/pps/ppsN/name matches its /dev/ptpN).
gpsd_state: started
gpsd_enabled: true
gpsd_devices: "/dev/ttyS7"
gpsd_baud: "115200"
gpsd_options: "-s {{ gpsd_baud }} -n"

# igc-ppsfix DKMS driver (TimeNIC I226 PPS fixes, see igc-ppsfix/README.md).
# Installed on disk only -- loads at the next reboot. Ansible flags
# /run/reboot-required and never reloads igc live (enp1s0 is the igc NIC).
igc_ppsfix_enabled: true
igc_ppsfix_auto_reboot: false  # opt-in: let Ansible reboot when a new build is staged

# ptp-ocp-gnsspps DKMS driver: the TAP PTM-capable ptp_ocp + raw GNSS PPS
# patch (see ptp-ocp-gnsspps/README.md). REQUIRED on this card -- its FPGA
# runs a PTM image the stock in-tree driver cannot drive (all-ones
# registers, wedged udev). Stock ptp_ocp is blacklisted; ptp_ocp-load.service
# loads the DKMS build at boot. Same reboot conventions as igc-ppsfix.
ptp_ocp_gnsspps_enabled: true
ptp_ocp_gnsspps_auto_reboot: false

# Enable kernel PPS events on the Timecard PHC at boot (PTP_ENABLE_PPS ioctl
# in timecard-sma.sh). Without this, the PHC's ppsN device exists but never
# asserts.
timecard_kernel_pps: true

# gpsd-exporter PPS histogram (gpsd_pps_histogram_bucket, used by the GPSD
# dashboard's "Clock offset from PPS" panels). Bucket span = size * count,
# centered on 0: 1000 ns x 40 = +/-20 us -- PPS asserts are timestamped by
# the system clock at IRQ time, so interrupt latency dominates the spread.
gpsd_exporter_pps_bucket_ns: 1000
gpsd_exporter_pps_bucket_count: 40

# Timecard SMA routing (ptp_ocp sysfs). Writes don't persist across reboot,
# so a systemd oneshot (timecard-sma.service) reapplies them at boot.
# Only keys listed under timecard_sma are written; see
# /sys/class/timecard/<dev>/available_sma_inputs and available_sma_outputs
# on the host for the accepted values.
timecard_device: ocp0
timecard_sma_wait_timeout: 30  # seconds to wait for the sysfs node at boot

# UTC-TAI handling: none needed -- the FPGA TOD engine applies the leap
# offset itself from the GNSS receiver's UBX leap-second field, so the
# PHC lands in TAI on its own (verified 2026-08-25; on a COLD GNSS start
# the leap data can take ~12.5 min to arrive, during which the tai
# refclocks falsetick and then self-heal). timecard_utc_tai_offset is
# retired ('utc_tai_offset' never affected the PHC -- IRIG/DCF outputs
# only), which leaves timecard-sma.sh's guarded offset block inert.
# Known hazard, handled by hand if it recurs: 'tod_correction' is an
# extra live TOD adjustment whose value SURVIVES WARM REBOOTS -- a stray
# 37 written there on the bench put the PHC at UTC+74. If the tai
# refclocks ever read a multiple of ~37 s off, check it and zero it.
timecard_sma:
  sma1: "OUT: PHC"    # FPGA PPS out -> cable to TimeNIC PPS IN
  sma2: "OUT: 10Mhz"
  sma3: "OUT: PHC"     

# Arm the Mu's TGPIO 1PPS output on edge-connector pin 123 (GPP_B14 =
# TIME_SYNC1 = ACPI INTC1024) at boot, via a udev rule. The rule arms every
# pps-gen device on purpose -- the index is not stable and there is no other
# attribute to match on. Output is a 1 Hz 50%-duty square wave, not a narrow
# pulse, with edges on the second boundary. See the "TGPIO 1PPS on
# LattePanda Mu pin 123" note.
tgpio_pps_enabled: true

# Enable NIC hardware timestamping for NTP clients (hwtimestamp * in
# refclock.conf).
chrony_hwtimestamp: true

# Refclock to be used as a time source.
# See: https://chrony-project.org/doc/3.4/chrony.conf.html#refclock
chrony_refclock: |
  # /dev/ptp-timecard is the udev symlink to the Timecard PHC
  # (roles/timecard files/99-ptp-timecard.rules) -- raw /dev/ptpN numbers
  # follow probe order and moved under us on the 2026-08-25 reboot,
  # leaving chrony disciplining a free-running NIC PHC at +37 s.
  # :nocrossts removes PTM
  refclock PHC /dev/ptp-timecard:nocrossts poll 0 refid AC tai noselect
  refclock PHC /dev/ptp-timecard poll 0 dpoll -5 refid PTM tai prefer

  # Monitor (but never select) the NIC PHC that ptp4l serves to clients.
  # Still a raw /dev/ptpN (correct-by-luck after the 2026-08-25
  # renumbering); update by hand if probe order changes again.
  refclock PHC /dev/ptp0 poll 0 dpoll -5 tai noselect refid NIC

  # Uncomment to log timing statistics.
  #log tracking measurements statistics

# Hosts allowed to query chrony for NTP time.
# See: https://chrony-project.org/doc/3.4/chrony.conf.html#allow
chrony_allow: "10.3.0.0/16"

# NTP upstream servers
chrony_servers:
  - ntp1.npl.co.uk
  - ntp2.npl.co.uk
  - ntp3.npl.co.uk
  - ntp4.npl.co.uk
  - ntp5.npl.co.uk
  - time.cloudflare.com
  - time.conorrobinson.ie

chrony_server_options: iburst xleave

# NIC-PHC discipline. The Timecard's SMA PPS output is cabled to the
# TimeNIC's SDP1; ts2phc hardware-timestamps the edges and disciplines the
# NIC PHC, which ptp4l then serves to clients.
#
#   GNSS -> Timecard FPGA PHC -> SMA "OUT: PHC" -> i226 SDP1 -> ts2phc
#        -> NIC PHC (enp1s0) -> ptp4l -> network
#
# Sink, presync source and pin index come from
# roles/linuxptp/defaults/main/ts2phc.yml; override here if the cabling
# changes. (This replaces the old gm_pipeline switch, whose profile files
# under vars/gm_pipelines/ were removed in a9617f1 -- with the phc2sys
# template gone too, the software baseline is not currently deployable.)
ts2phc_enabled: true

# Every service running a binary from the linuxptp build; the role's
# handler restarts these after a rebuild.
linuxptp_managed_services:
  - ptp4l
  - ts2phc

# Grandmaster-specific ptp4l.conf directives (appended to the shared header
# in roles/ptp4l/templates/ptp4l.conf.j2).
ptp4l_conf_extra: |
  # Act only as a master. ('serverOnly' on later versions...)
  masterOnly 1

  # BMCA priorities (lower wins)
  priority1 127
  priority2 127

  # clockClass=6 for GNSS reference
  # other classes = https://documentation.nokia.com/srlinux/24-10/books/network-synchronization/ieee-1588-ptp.html
  clockClass 6

  # 0x20 = time accurate to within 25ns
  clockAccuracy 0x20

  # Sync message rate: 2^-3 = 8 msgs/sec
  logSyncInterval -3

  # Announce message rate: 2^0 = 1 msg/sec
  logAnnounceInterval 0

# ts2phc needs the igc-ppsfix driver loaded, an SMA cable from Timecard PPS
# OUT to TimeNIC PPS IN, and timecard_sma routing "OUT: PHC" on the cabled
# connector (bench-check: testptp shows extts events).

# Monitoring stack (Prometheus + exporters) running in Docker. Grafana
# lives on the homelab Grafana server, which points a datasource (uid
# "prometheus") at this Prometheus; dashboards are imported by hand from
# files/dashboards/.
monitoring_deploy_path: /opt/monitoring
monitoring_uid: "1000"
monitoring_gid: "1000"

# Where ptp-metrics.sh writes node_exporter textfile metrics.
ptp_metrics_textfile_dir: "{{ monitoring_deploy_path }}/textfile"

prometheus_image: "prom/prometheus:v3.13.1"
prometheus_port: 9090
prometheus_retention: 30d

chrony_exporter_image: "quay.io/superq/chrony-exporter:v0.14.0"
node_exporter_image: "prom/node-exporter:v1.12.1"
gpsd_exporter_image: "ghcr.io/brendanbank/gpsd-prometheus-exporter:latest"
