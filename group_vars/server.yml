---
# ===[ GPSd ]==============================================================
gpsd_state: started
gpsd_enabled: true
gpsd_devices: "/dev/ttyS7"
gpsd_baud: "115200"
gpsd_options: "-s {{ gpsd_baud }} -n"

# ===[ Timecard/System ]====================================================

timecard_sma:
  sma1: "OUT: GNSS1"    # FPGA PPS out -> cable to TimeNIC PPS IN
  sma2: "OUT: 10Mhz"  # TICC 10Mhz reference
  sma3: "OUT: PHC"

# Build the PPS-fixed igc driver (roles/igc_ppsfix); required for ts2phc
# EXTTS on the TimeNIC.
igc_ppsfix_enabled: true

# Arm the Mu's TGPIO 1PPS output on edge-connector pin 123
tgpio_pps_enabled: true

# ===[ Chrony ]===========================================================

chrony_hwtimestamp: true

# Refclock to be used as a time source.
chrony_refclock: |
 
  # refids are NTP reference IDs: 4 ASCII chars max (chronyd rejects longer).
  refclock PHC /dev/ptp-timecard poll 0 dpoll -5 refid TCPM tai prefer

  # Monitor (but never select)
  # :nocrossts removes PTM
  refclock PHC /dev/ptp-timecard:nocrossts poll 0 dpoll -5 refid TC tai noselect
  refclock PHC /dev/ptp0 poll 0 dpoll -5 refid NIC tai noselect


  # log timing statistics.
  log tracking measurements statistics

# NTP upstream servers
chrony_servers:
  - ntp1.npl.co.uk
  - ntp2.npl.co.uk
  - ntp3.npl.co.uk
  - ntp4.npl.co.uk
  - ntp5.npl.co.uk
  #- time.cloudflare.com
  #- time.conorrobinson.ie
chrony_server_options: iburst xleave

# Hosts allowed to query chrony for NTP time.
chrony_allow: "10.3.0.0/16"


# ===[ ntpheat ]===========================================================
# SCHED_IDLE CPU heater holding the N100 package at a setpoint so the ART
# crystal stops following room temperature (roles/ntpheat). Measured
# 2026-09-04 with the CPU pinned at 1.6 GHz (BIOS SpeedStep+Turbo on, PL
# 12 W; the pin itself is host-only GRUB config on the GM, not in this repo):
# idle 55-56 C at 3.8 W, all four AES burners 7.3 W for a ceiling around
# 72-75 C. The setpoint sits low in that range: ~6 C of margin for a warmer
# room before the heater floats, ~10 C for a colder one before it saturates.
# Tune against ntpheat_duty_ratio in Prometheus: ~1.0 means the burners
# can't reach it (lower the setpoint), ~0.0 means the room is doing the work
# (raise it). At the old 800 MHz base ratio the range was only 52-60 C.
#
# 2026-09-05: the controller now reads the external TMP117 (below)
# instead of the package sensor, so the setpoint and gains are in TMP117
# terms. Open-loop step test that evening (heater 0 -> 100%, 3.6 -> 7.3 W
# package power, ~22 C room): the TMP117 rose ~5 C per unit duty with a
# ~1000 s time constant and ~20 s dead time, against a 14 C package rise.
# So the heater has only ~5 C of authority over this sensor: a room change
# of much more than +/-2 C saturates it (duty pinned at 0 or 1). The
# heater-off level settled at ~46.3 C once the enclosure had re-warmed
# after the sensor was fitted, so full burn is ~51 C and 48.5 C sits
# mid-range for a duty near 0.45. Gains are SIMC for that plant
# (tau_c = tau/2): damping ratio ~1 for any gain between 3 and 7 C/duty,
# ~12 min closed-loop time constant, settles in ~40 min. Retune the
# setpoint from ntpheat_duty_ratio if the season moves the room.
ntpheat_enabled: true
ntpheat_iio_name: tmp117
ntpheat_target_temp: 48.5
ntpheat_kp: 0.4
ntpheat_ki: 0.0004
ntpheat_copies: 4

# ===[ tmp117 ]============================================================
# External TI TMP117 temperature sensor on the Mu's host I2C bus 3 at 0x48
# (roles/ntpheat, tasks/tmp117.yml); ntpheat regulates on it.
# Read it with `tmp117.sh` (or `tmp117.sh 1` to stream).
tmp117_enabled: true
tmp117_i2c_bus: 3
tmp117_i2c_addr: "0x48"

# ===[ Linuxptp ]==========================================================
# linuxptp is built from source on each host for the latest features.
# Install paths are hardcoded in the roles, deliberately not variables:
# source builds live in /usr/local/src/<name> and install to
# /usr/local/sbin (FHS 3.0 4.9.1/4.9.2 and 3.16.1). Only the version pins
# below are tunable.
linuxptp_repo: git://git.code.sf.net/p/linuxptp/code
linuxptp_version: f98cb5de87e63696599c59d0a9df7dc04d08d40d

# ── ts2phc ───────────────────────────────────────────────────────────────

# NIC-PHC discipline. The Timecard's SMA PPS output is cabled to the
# TimeNIC's SDP1; ts2phc hardware-timestamps the edges and disciplines the
# NIC PHC, which ptp4l then serves to clients.
#
#   GNSS -> Timecard FPGA PHC -> SMA "OUT: PHC" -> i226 SDP1 -> ts2phc
#        -> NIC PHC (enp1s0) -> ptp4l -> network
#
# Sink, presync source and pin index come from
# roles/linuxptp/defaults/main/ts2phc.yml; override here if the cabling
# changes. (This replaces the old gm_pipeline switch, whose profile files
# under vars/gm_pipelines/ were removed in a9617f1 -- with the phc2sys
# template gone too, the software baseline is not currently deployable.)
ts2phc_enabled: true

# ── ptp4l ───────────────────────────────────────────────────────────────
# PTP runs on the primary NIC; override per host if needed.
ptp4l_ptp_iface: "enp1s0"

# Grandmaster-specific ptp4l.conf directives (appended to the shared header
# in roles/ptp4l/templates/ptp4l.conf.j2).
ptp4l_conf_extra: |
  # Act only as a master. ('serverOnly' on later versions...)
  masterOnly 1

  # BMCA priorities (lower wins)
  priority1 127
  priority2 127

  # clockClass=6 for GNSS reference
  # other classes = https://documentation.nokia.com/srlinux/24-10/books/network-synchronization/ieee-1588-ptp.html
  clockClass 6

  # 0x20 = time accurate to within 25ns
  clockAccuracy 0x20

  # Sync message rate: 2^-3 = 8 msgs/sec
  logSyncInterval -3

  # Announce message rate: 2^0 = 1 msg/sec
  logAnnounceInterval 0

# ts2phc needs the igc-ppsfix driver loaded (built by roles/igc_ppsfix),
# an SMA cable from Timecard PPS OUT to TimeNIC PPS IN, and timecard_sma
# routing "OUT: PHC" on the cabled connector (bench-check: testptp shows
# extts events).

