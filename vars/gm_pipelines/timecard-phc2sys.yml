---
# Software pipeline (comparison baseline): chrony disciplines CLOCK_REALTIME
# from the Timecard PHC refclock (as always); phc2sys steers the NIC PHC
# from CLOCK_REALTIME in software. No SMA cable / EXTTS involved.
#
#   GNSS -> Timecard FPGA PHC -> chrony -> CLOCK_REALTIME -> phc2sys
#        -> NIC PHC (/dev/ptp-nic) -> ptp4l -> network
gm_ts2phc_enabled: false
gm_phc2sys_enabled: true

# Restarted after a linuxptp rebuild (roles/linuxptp handler).
linuxptp_managed_services:
  - ptp4l
  - phc2sys

phc2sys_source: CLOCK_REALTIME
phc2sys_clock: /dev/ptp-nic
# -w waits for ptp4l and takes the UTC-TAI offset from it (the unit orders
# after ptp4l). If -w misbehaves on a masterOnly ptp4l, replace with an
# explicit "-O <offset>" -- verify the sign live: a ~37 s phc offset in the
# journal means it is wrong.
phc2sys_extra_opts: '-w -m'
phc2sys_service_state: started
phc2sys_service_enabled: true
